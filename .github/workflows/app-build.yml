name: App Build

# Builds the SwiftUI app and packages it as a jailbreak .deb.
#
# Two jobs on purpose: `build` produces the .app once (an Xcode build is the slow
# part), then the matrix job packages it twice — rootless and rootful — which is
# the only thing that differs between the two artefacts.
on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Packaging/**'
      - 'Package.swift'
      - '.github/workflows/app-build.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Packaging/**'
      - 'Package.swift'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_BUNDLE_NAME: TheosStudio.app
  SCHEME: TheosStudio
  DERIVED_DATA: build
  PRODUCTS_DIR: build/Build/Products/Release-iphoneos
  APP_BUNDLE_PATH: build/Build/Products/Release-iphoneos/TheosStudio.app

jobs:
  build:
    name: Build TheosStudio.app (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          set -euo pipefail
          brew install xcodegen
          brew install ldid dpkg
          xcodegen --version
          ldid -v | head -n 1 || true
          dpkg-deb --version

      - name: Warm up SwiftPM (resolve and build the engine)
        run: |
          set -euo pipefail
          swift build

      - name: Run the engine test suite
        run: |
          set -euo pipefail
          # The app is a shell over the engine; there is no point building the
          # shell if what it drives is broken.
          swift test

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec App/project.yml --project App

      - name: Build the app bundle
        run: |
          set -euo pipefail
          xcodebuild \
            -project App/TheosStudio.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Bundle Theos into the app
        run: |
          set -euo pipefail
          THEOS_DIR="$APP_BUNDLE_PATH/Theos"
          rm -rf "$THEOS_DIR"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS_DIR"
          # Git metadata has no runtime value and would substantially inflate the package.
          find "$THEOS_DIR" -name .git -type d -prune -exec rm -rf {} +
          test -f "$THEOS_DIR/makefiles/common.mk" || {
            echo "::error::bundled Theos is missing makefiles/common.mk"
            exit 1
          }
          echo "Bundled Theos: $(du -sh "$THEOS_DIR" | awk '{print $1}')"

      - name: Verify the app bundle
        run: |
          set -euo pipefail
          test -d "$APP_BUNDLE_PATH" || { echo "::error::$APP_BUNDLE_PATH was not produced"; exit 1; }
          test -x "$APP_BUNDLE_PATH/TheosStudio" || { echo "::error::$APP_BUNDLE_PATH/TheosStudio is missing or not executable"; exit 1; }
          test -f "$APP_BUNDLE_PATH/Theos/makefiles/common.mk" || { echo "::error::bundled Theos is missing"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_BUNDLE_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_BUNDLE_PATH/Info.plist"
          lipo -info "$APP_BUNDLE_PATH/TheosStudio"
          # The entitlements cannot be applied by Apple's signing, but the app has
          # to be *built* expecting them: a missing platform-application is the
          # difference between an app that runs make and one that is killed at
          # launch.
          grep -q 'platform-application' App/TheosStudio.entitlements

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: theosstudio-app
          # The *containing* directory is uploaded on purpose: upload-artifact
          # keeps paths relative to the uploaded root, so Release-iphoneos/
          # lands a TheosStudio.app/ at the top of the artifact and the packaging
          # job finds it without guessing.
          path: ${{ env.PRODUCTS_DIR }}/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package .deb (${{ matrix.layout }})
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        layout:
          - rootless
          - rootful
    steps:
      - name: Checkout (for Packaging/ and App/TheosStudio.entitlements)
        uses: actions/checkout@v4

      - name: Install packaging tooling
        run: |
          set -euo pipefail
          brew install ldid dpkg
          dpkg-deb --version

      - name: Download the app bundle
        uses: actions/download-artifact@v4
        with:
          name: theosstudio-app
          path: app

      - name: Restore file modes
        # upload-artifact/download-artifact does not guarantee that the executable
        # bit survives the round trip, and build-deb.sh refuses a bundle whose main
        # binary is not executable.
        run: |
          set -euo pipefail
          find "$PWD/app" -maxdepth 4 | head -20
          APP_PATH=$(find "$PWD/app" -type d -name "$APP_BUNDLE_NAME" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::no $APP_BUNDLE_NAME anywhere under $PWD/app"
            exit 1
          fi
          echo "using app bundle at $APP_PATH"
          find "$APP_PATH" -type d -exec chmod 0755 {} +
          chmod 0755 "$APP_PATH/TheosStudio"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Print the package layout
        run: |
          set -euo pipefail
          sh Packaging/build-deb.sh --${{ matrix.layout }} --print-layout

      - name: Build the .deb
        run: |
          set -euo pipefail
          sh Packaging/build-deb.sh --${{ matrix.layout }} --output dist

      - name: Assert the .deb is what it claims to be
        run: |
          set -euo pipefail
          deb=$(find dist -maxdepth 1 -name 'theosstudio_*.deb' -print | head -n 1)
          if [ -z "$deb" ]; then
            echo "::error::no .deb was produced in dist/"
            exit 1
          fi
          echo "inspecting $deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"

          if ! dpkg-deb -c "$deb" | grep -E 'Applications/TheosStudio\.app/TheosStudio

          expected_arch=$([ "${{ matrix.layout }}" = "rootless" ] && echo iphoneos-arm64 || echo iphoneos-arm)
          actual_arch=$(dpkg-deb -f "$deb" Architecture)
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "::error::$deb declares Architecture: $actual_arch, expected $expected_arch"
            exit 1
          fi

          if [ "${{ matrix.layout }}" = "rootless" ]; then
            if ! dpkg-deb -c "$deb" | grep -q 'var/jb/etc/sudoers.d/theosstudio$'; then
              echo "::error::rootless package is missing its TheosStudio sudo policy"
              exit 1
            fi
            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT
            dpkg-deb -x "$deb" "$tmpdir"
            policy="$tmpdir/var/jb/etc/sudoers.d/theosstudio"
            test -f "$policy" || { echo "::error::sudo policy was not extracted"; exit 1; }
            grep -q '^mobile ALL=(root) NOPASSWD:' "$policy" || {
              echo "::error::TheosStudio sudo policy does not grant scoped passwordless commands"
              exit 1
            }
            grep -q '/var/jb/usr/bin/apt-get' "$policy" || {
              echo "::error::TheosStudio sudo policy does not cover apt-get"
              exit 1
            }
          fi
          echo "OK: $deb ($actual_arch)"

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: theosstudio-deb-${{ matrix.layout }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
; then
            echo "::error::$deb does not contain Applications/TheosStudio.app/TheosStudio"
            exit 1
          fi
          if ! dpkg-deb -c "$deb" | grep -E 'Applications/TheosStudio\.app/Theos/makefiles/common\.mk

          expected_arch=$([ "${{ matrix.layout }}" = "rootless" ] && echo iphoneos-arm64 || echo iphoneos-arm)
          actual_arch=$(dpkg-deb -f "$deb" Architecture)
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "::error::$deb declares Architecture: $actual_arch, expected $expected_arch"
            exit 1
          fi

          if [ "${{ matrix.layout }}" = "rootless" ]; then
            if ! dpkg-deb -c "$deb" | grep -q 'var/jb/etc/sudoers.d/theosstudio$'; then
              echo "::error::rootless package is missing its TheosStudio sudo policy"
              exit 1
            fi
            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT
            dpkg-deb -x "$deb" "$tmpdir"
            policy="$tmpdir/var/jb/etc/sudoers.d/theosstudio"
            test -f "$policy" || { echo "::error::sudo policy was not extracted"; exit 1; }
            grep -q '^mobile ALL=(root) NOPASSWD:' "$policy" || {
              echo "::error::TheosStudio sudo policy does not grant scoped passwordless commands"
              exit 1
            }
            grep -q '/var/jb/usr/bin/apt-get' "$policy" || {
              echo "::error::TheosStudio sudo policy does not cover apt-get"
              exit 1
            }
          fi
          echo "OK: $deb ($actual_arch)"

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: theosstudio-deb-${{ matrix.layout }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
; then
            echo "::error::$deb does not contain the bundled Theos toolchain"
            exit 1
          fi

          expected_arch=$([ "${{ matrix.layout }}" = "rootless" ] && echo iphoneos-arm64 || echo iphoneos-arm)
          actual_arch=$(dpkg-deb -f "$deb" Architecture)
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "::error::$deb declares Architecture: $actual_arch, expected $expected_arch"
            exit 1
          fi

          if [ "${{ matrix.layout }}" = "rootless" ]; then
            if ! dpkg-deb -c "$deb" | grep -q 'var/jb/etc/sudoers.d/theosstudio$'; then
              echo "::error::rootless package is missing its TheosStudio sudo policy"
              exit 1
            fi
            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT
            dpkg-deb -x "$deb" "$tmpdir"
            policy="$tmpdir/var/jb/etc/sudoers.d/theosstudio"
            test -f "$policy" || { echo "::error::sudo policy was not extracted"; exit 1; }
            grep -q '^mobile ALL=(root) NOPASSWD:' "$policy" || {
              echo "::error::TheosStudio sudo policy does not grant scoped passwordless commands"
              exit 1
            }
            grep -q '/var/jb/usr/bin/apt-get' "$policy" || {
              echo "::error::TheosStudio sudo policy does not cover apt-get"
              exit 1
            }
          fi
          echo "OK: $deb ($actual_arch)"

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: theosstudio-deb-${{ matrix.layout }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
