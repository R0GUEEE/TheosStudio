name: Engine

# The engine is pure Swift with no Xcode project and no Apple-only framework, so
# this is the fast, strict workflow: it builds the library and the CLI and runs
# the test suite. Building the app and packaging the .deb live in app-build.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'App/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'App/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The engine imports nothing Apple-only, so Linux runs the same tests in a
      # fraction of the time — and macOS runners are shared, which makes them
      # occasionally take twenty minutes to start or, worse, to finish one step.
      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
            swiftpm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test the suites this change touches, serially
        run: |
          set -u
          # Serial on purpose: a test process that dies takes its whole worker
          # with it under --parallel, and the name of the test that crashed is
          # then a guess.
          #
          # Each suite gets its own watchdog. A test that never returns otherwise
          # consumes the job's whole timeout and says nothing about which one it
          # was, which is exactly what happened twice.
          for suite in MakefileEditorTests CrashLogParserTests GitPorcelainTests DebListingTests TheosInstallerTests AgentProviderTests AgentModelListTests PrivilegesTests; do
            printf '\n===== %s =====\n' "$suite"
            swift test --filter "$suite" &
            runner=$!
            ( sleep 120; kill -9 "$runner" 2>/dev/null ) &
            watchdog=$!
            wait "$runner"
            status=$?
            kill "$watchdog" 2>/dev/null
            wait "$watchdog" 2>/dev/null
            if [ "$status" -ne 0 ]; then
              echo "::error::$suite did not finish cleanly (exit $status)"
              exit 1
            fi
          done

      - name: Test
        run: swift test

      # The CLI is what makes the engine usable without the app, and it is the
      # only place the filesystem-facing half is exercised. Scaffold a project,
      # read it back, and check the plan it prints.
      - name: Smoke-test the CLI
        run: |
          set -euo pipefail
          .build/debug/theosstudio help > /dev/null
          .build/debug/theosstudio env

          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          .build/debug/theosstudio new tweak Smoky --dir /tmp/smoke/Smoky \
            --scheme rootless --identifier com.example.smoky --author Someone --email someone@example.com

          test -f /tmp/smoke/Smoky/Makefile
          test -f /tmp/smoke/Smoky/control
          test -f /tmp/smoke/Smoky/Smoky.plist
          grep -q 'export THEOS_PACKAGE_SCHEME = rootless' /tmp/smoke/Smoky/Makefile
          grep -q 'TWEAK_NAME = Smoky' /tmp/smoke/Smoky/Makefile

          .build/debug/theosstudio lint /tmp/smoke/Smoky
          .build/debug/theosstudio plan /tmp/smoke/Smoky --final | tee /tmp/smoke/plan.txt
          grep -q -- '-C /tmp/smoke/Smoky' /tmp/smoke/plan.txt
          grep -q 'FINALPACKAGE=1' /tmp/smoke/plan.txt

          # Every generated project must be self-describing: the app labels a
          # folder by reading these two files back.
          for kind in tweak tweakWithPreferences preferenceBundle application tool; do
            # A package identifier is lowercase by definition; the project name is
            # not. `lint` would (correctly) reject the camel-case form.
            slug=$(printf '%s' "$kind" | tr '[:upper:]' '[:lower:]')
            .build/debug/theosstudio new "$kind" "Smoky$kind" --dir "/tmp/smoke/$kind" --identifier "com.example.smoky$slug"
            .build/debug/theosstudio lint "/tmp/smoke/$kind"
          done

          # A tweak with preferences has to produce a subproject Theos can build.
          test -f /tmp/smoke/tweakWithPreferences/prefs/Makefile
          test -f /tmp/smoke/tweakWithPreferences/layout/Library/PreferenceLoader/Preferences/SmokytweakWithPreferences.plist
